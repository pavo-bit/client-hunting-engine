# MILESTONE 3: repeatable quality gates.
#
# No git remote exists yet, so this workflow has not executed on a provider —
# every step below is validated locally in the milestone report (same commands,
# same order, same failure semantics: any failing step fails the run).
# Connect a remote and push to execute it for real; no step needs secrets.
#
# Database safety: tests run against an explicit scratch database
# (agency_intel_ci) created by the job itself. Every suite refuses
# non-loopback hosts, so a misconfigured URL fails closed instead of
# touching anything else.

name: quality-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/agency_intel_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/agency_intel_ci
      TEST_NOACCESS_URL: postgresql://noaccess:noaccess-local-only@127.0.0.1:5434/agency_intel_ci
      # Phase 4 / A2: the Phase 2 principal URL is now declared EXPLICITLY.
      # It previously fell back to a hardcoded `agency_intel_test`, which does
      # not exist in this job, so the permission suites silently targeted the
      # wrong (or no) database. One isolated CI database supports the whole suite.
      TEST_P2_URL: postgresql://p2_app:p2-app-local-only@127.0.0.1:5434/agency_intel_ci
      APP_NOACCESS_USER: noaccess
      APP_NOACCESS_PASSWORD: noaccess-local-only
      APP_P2_USER: p2_app
      APP_P2_PASSWORD: p2-app-local-only
      # Phase 4 / A3: the backup workflow shells into a container, so CI now
      # provisions the project's OWN compose stack (step below) and names it.
      # A GitHub `services:` container has no such name, which is why the
      # backup/restore suite could not run here before.
      BACKUP_CONTAINER: grayscales-pg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agency_intel_ci
      POSTGRES_PORT: "5434"
      OPERATOR_EMAIL: ci-operator@example.com
      # Plain $ separators here (NOT \$ escaped): GitHub Actions passes env
      # values literally, while Next.js expands $VAR only inside .env FILES.
      # Escaping here would break the shape check and fail closed.
      # Shape-valid but random 64-byte key: NO password verifies against it,
      # so interactive login in CI always fails closed (401). The Vitest
      # suites provision their own in-process credentials and are unaffected.
      # Never replace this with a real credential.
      OPERATOR_PASSWORD_HASH: scrypt$16384$8$1$Y2ktY2ktc2FsdC12ZXJ5LWxvbmctYW5kLXJhbmRvbQ==$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
      OPERATOR_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Start PostgreSQL via the project compose stack
        run: docker compose up -d --wait
      - name: Type check
        run: npx tsc --noEmit
      - name: Bootstrap scratch database (creates DB + noaccess role)
        run: node scripts/db.mjs bootstrap
      - name: Migrate scratch database
        run: node scripts/db.mjs migrate
      - name: Seed twice (idempotency)
        run: |
          node scripts/db.mjs seed
          node scripts/db.mjs seed
      - name: SQL verification suite
        run: node scripts/db.mjs verify
      - name: Full Vitest suite
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Dump PostgreSQL logs if the job failed
        if: failure()
        # Container logs never contain connection passwords (PGPASSWORD is
        # passed via exec env only), so this is safe to print.
        run: docker logs --tail 200 grayscales-pg || true
